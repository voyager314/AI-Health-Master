<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS 从主屏启动时读这个链接找图标，manifest 里的 icons 对它不生效 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- viewport-fit=cover 配合 index.css 的 safe-area-inset，让底部操作区不被手势条压住 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#121316" />
    <!-- 独立窗口启动时 iOS 隐藏 Safari 的界面，与 manifest 的 display 对应 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Health Master" />
    <meta name="description" content="增肌期力量训练者的训练记录与体重趋势工具" />
    <title>AI Health Master</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

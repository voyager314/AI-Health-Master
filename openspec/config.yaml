schema: spec-driven

context: |
  # AI Health Master

  面向「增肌期力量训练者」的 PWA。本期只做三件事：训练记录、体重趋势、饮食蛋白测算。
  睡眠与音乐已永久/暂时移出范围。需求文档为仓库根 `PRD-Normal.md`（当前 v0.3）。

  产品存在理由：用语音把一组训练记录的成本压到一句话。其余功能都是为这条主线服务。

  ## 技术栈
  - 前端：`frontend/` — Vite + React 19 + TypeScript，PWA（移动端优先），测试用 vitest。
  - 后端：`backend/` — uv + Python 3.13。定位是**无状态 AI 网关**（密钥托管、ASR/LLM 代理、限流），
    不承载业务数据、不建数据库、不做定时任务。v0.2 才开始需要，v0.1 完全不碰。
  - 业务数据：**本地优先**，只存浏览器 IndexedDB，不上传服务端；支持导出与导入。

  ## 版本切分（change 的粒度参照）
  - v0.1 上半 `local-data-foundation`：数据层地基 + 导出/导入/清空 + PWA 外壳 + 告知同意。
  - v0.1 下半 `training-log-and-weight`：动作库、训练模板、手动记录组次重量、训练编辑、体重记录与周均趋势、目标设置。
  - v0.2：语音记录全链路 + 上次对比（FR-T07）+ 容量统计（FR-T08）。
  - v0.3：饮食拍照 → 营养结构化 → 明细编辑 → 当日汇总。
  - v0.4：每周复盘建议 + 蛋白缺口提示 + 指标看板。

  注意：PRD §7.6 把 FR-T07/T08 标为 v0.1，与 §13.2、§15.3 冲突。**已拍板以 v0.2 为准。**

  ## 可迁移性硬约束（PRD §10.5，必须从第一行代码开始遵守）
  本期用 IndexedDB 快速起步，但将来要换 MySQL。目标：只替换存储实现，不重写业务逻辑。
  约束 1、3、9 是「一旦违反就必须重写」的三条，属硬性一票否决。

  1. 存储访问收敛到 Repository 层，每实体一个 repo（list/get/put/remove/query/clear）。
     页面与组件禁止直接调用 IndexedDB API；`indexedDB` 与 `db.` 只允许出现在 `storage/indexeddb/**`。
  2. 主键为 UUID v7（时间有序），并额外带 `client_id` 幂等键；禁止自增 ID。
     注意浏览器 `crypto.randomUUID()` 返回的是 v4，必须引入 v7 实现，不得退化为 v4。
  3. 每条业务记录现在就带 `user_id`，本地固定为 `'local'`，上云时只回填真实值、不改表结构。
  4. 每条记录带 `version`（整数），本地恒为 1，上云后作为乐观锁。
  5. 软删除：用 `deleted_at`，禁止物理删除。唯一例外是「清空全部数据」与图片 blob 的自动清理。
  6. 时间统一存 UTC ISO 8601 字符串 + 独立 `tz_offset_minutes`；禁止带偏移的时间字符串。
     「自然日 / 自然周」边界计算只允许在一个 `stats/timeWindow` 模块内实现，全局仅此一处。
  7. 图片存 Blob 于独立 store，业务记录只存字符串 `storage_ref`（本地为 `local://<uuid>`）；
     禁止 base64 塞进记录。
  8. 查询只用「主键或单字段索引取数 + 内存过滤」，禁止依赖复合游标做业务逻辑；
     每个 repo 的查询都要能翻译成一条 `SELECT ... WHERE`。
  9. 所有写操作走统一 Command 层 `applyCommand(type, payload)`，本地同步执行并写入 `pending_ops`；
     组件内禁止散落写库，页面只调用 command、不直接调用 repo 的写方法。
  10. `schema_version` + 顺序迁移脚本数组，启动时按版本执行，迁移前自动导出备份。
  11. 导出 JSON 结构 = 内部结构，带 `schema_version` 与导出时间；导出即迁移载体，必须可反向导入且数据完全一致。
      CSV 仅供用户查看，**只出不进**，不要求可往返。
  12. 领域计算为纯函数（容量、周均体重、蛋白达成率），入参为实体数组，不读存储，可单测。

  ## 数据模型
  9 张**业务**表（约束 3/4 的 `user_id` / `version` 适用于这 9 张）：
  exercise / workout / workout_exercise / set_entry / body_metric / meal / meal_item / target / app_meta

  另有 3 个非业务 store（不计入上面的「9 张表」口径）：
  - `pending_ops` — 本期作为写入日志用于调试与校验，上云后直接作为离线队列载体（约束 9）
  - `blob` — 图片二进制，业务记录只存 ref（约束 7）
  - `analytics_event` — 本地埋点事件（PRD §10.3）

  动作模式枚举保留 **9 类**：水平推、垂直推、水平拉、垂直拉、蹲、髋铰链、单腿、核心、孤立。
  只砍「负重行走」。PRD §三原写「只保留前 8 类」（即砍掉孤立），但 FR-T04 的验收例子用的「飞鸟」
  正是孤立动作，且增肌人群离不开弯举/侧平举/飞鸟/臂屈伸。**已拍板保留孤立。**

  ## AI 与数据可信度
  - AI 只做「填表」不做「终审」：语音与拍照的结果必须经用户确认才入库，逐字段可改，禁止猜测填充。
  - 营养数值本质是估算：界面必须以区间或「约」标注，带置信度（高/中/低），禁止伪精确值。
  - AI 失败时禁止阻断记录，一律降级到手动录入。

  ## 隐私与合规（健康数据按敏感个人信息从严处理）
  - 首次使用须展示数据处理说明并主动同意后方可使用，同意时间落 `app_meta.consent_at`。
  - AI 请求只传必要内容，不传可识别自然人的身份信息（允许匿名随机设备令牌用于限流）。
  - 服务端禁止持久化原图；日志禁止记录图片内容与完整转写文本。
  - 埋点只记结构化属性与区间值，禁止采集自由文本与图片。
  - 只给生活方式建议，禁止疾病诊断、药物与补剂处方；禁止绝对化用语与疗效承诺。
  - 界面固定展示「不替代专业医疗或营养建议」。

rules:
  proposal:
    - 标注本 change 对应 PRD 的哪些 FR 编号与哪个版本（v0.1/v0.2/...），便于追溯
    - 明确写出「不包含」的范围，指明归属到哪个后续 change
    - 若与 PRD 原文有出入（修正了矛盾、补了遗漏的需求），在提案里留痕说明依据
  specs:
    - 每条需求用 PRD 的 FR 编号命名，保持与 PRD 的追踪关系
    - 验收标准一律写成 Given / When / Then，必须可测；禁止「体验良好」这类不可验收的描述
    - 状态词遵循 PRD §七 的约定：必须(shall) / 应该(should) / 可以(may) / 禁止(must not)
    - 异常路径与降级行为是需求的一部分，不是可选项；AI 或存储失败时禁止静默丢数据
  design:
    - 逐条说明 PRD §10.5 的 12 条约束在本 change 里如何落地，以及如何自检
    - 任何偏离本地优先架构或偏离约束的决定，必须写明理由与将来上云的补救成本
    - 给出目录结构与分层边界（页面 → command → repo → storage），标出禁止跨层调用的位置
  tasks:
    - 任务按 2 小时左右的粒度切分，带可验证的完成判据
    - 约束 1/3/9 的自检任务必须单列，且作为本 change 的收尾验收项
    - 领域计算的纯函数要配单测任务（约束 12）
